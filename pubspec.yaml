name: e3lanak_app
description: "E3lanak - Smart Ad Generator & Merchant Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 1. Localization
  easy_localization: ^3.0.7

  # 2. Responsive UI & Aesthetics
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  gap: ^3.0.1
  flutter_animate: ^4.5.2

  # 3. Core Functionality & Media
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # 4. State Management & Architecture
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  fpdart: ^1.1.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 5. Backend & Security
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 6. Dev Dependencies & Code Generation
  build_runner: ^2.4.15
  freezed: ^3.0.1
  json_serializable: ^6.9.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/
